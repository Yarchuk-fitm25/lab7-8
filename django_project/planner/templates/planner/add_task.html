{% extends 'planner/base.html' %}
{% block title %}Додати завдання{% endblock %}
{% block content %}
<h2>Додати завдання</h2>
<form method="post" novalidate>
{% csrf_token %}
{% for field in form %}
<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>
{{ field }}
{% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
<button type="submit">Зберегти</button>
</form>
{% endblock %}
